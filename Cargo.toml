[package]
name = "pdfname"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Safe PDF renamer using Info and XMP publication metadata"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
lopdf = { version = "0.46", default-features = false }
roxmltree = "0.21"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
ureq = { version = "2.12", features = ["json"] }
walkdir = "2.5"
